name: pages

# Publishes the park forecast page to GitHub Pages: restores the history from the data branch, rebuilds
# the training table, trains, then scores each ride's newest snapshot and draws the evidence charts.
# Runs after each successful collect run (so after each batch of new data) and on demand.
# One-time setup in the repository: Settings > Pages > Source: GitHub Actions.
on:
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[train]"
      - name: Restore history from the data branch
        run: bash scripts/data_sync.sh pull
      - name: Build dataset and train
        run: |
          python -m parkwaits.cli build
          python -m parkwaits.cli train
      - name: Build the site (Powered by Queue-Times.com)
        run: python scripts/build_site.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
