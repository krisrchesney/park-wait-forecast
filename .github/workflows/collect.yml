name: collect

# Runs on a schedule and can also be started by hand from the Actions tab.
#
# Why one long job instead of a cron every few minutes: a scheduled job per snapshot would push a data
# commit every time (about 100 a day) and bloat the repository. This job polls inside ONE process
# (every 10 minutes for about 5.75 hours) and pushes once at the end, so four runs a day cover the clock.
# Scheduled runs are best-effort and can start late, so expect small gaps; the pipeline drops rows
# around gaps instead of guessing. GitHub may pause scheduled workflows after about 60 days without
# repository activity. Public repositories run Actions free.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

permissions:
  contents: write

# One collector at a time: they all write to the same data branch. A queued run waits its turn.
concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore history from the data branch
        run: bash scripts/data_sync.sh pull
      - name: Poll Queue-Times (Powered by Queue-Times.com)
        run: python -m parkwaits.cli collect-loop --minutes 345
      - name: Save history to the data branch
        if: always()
        run: bash scripts/data_sync.sh push
